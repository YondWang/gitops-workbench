# Trusted Feature packaging. This file belongs only on protected
# ci/feature-package and never includes a .gitlab-ci.yml from OS/simos.

.feature_package_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_NAME == "ci/feature-package" && $GITOPS_FEATURE_PACKAGE == "1"'
      when: on_success
    - when: never

feature_context_validate:
  extends: .feature_package_rules
  stage: feature_validate
  # All trusted scripts are checked out from the protected Workbench ref.
  # Do not run this untagged: an old OS/simos Shell Runner may otherwise pick
  # it up and execute without the CI repository checkout.
  tags: ["simos-feature-build"]
  image: docker.m.daocloud.io/python:3.12-alpine
  variables:
    GIT_STRATEGY: fetch
  script:
    - python3 .gitlab/scripts/feature-package-validate.py
  artifacts:
    expire_in: 1 day
    paths:
      - feature-context.json

feature_build_resident:
  extends: .feature_package_rules
  stage: feature_build
  # This tag MUST be configured as a non-privileged container executor. The
  # guard in the script fails closed when it is still the old shell executor.
  tags: ["simos-feature-build"]
  # This protected variable names the maintained build image. GitLab expands
  # simple CI variables here; Bash-style ${VAR:-default} is not valid YAML CI
  # variable interpolation on all supported GitLab versions.
  image: "$GITOPS_FEATURE_BUILD_IMAGE"
  variables:
    GIT_STRATEGY: fetch
  needs:
    - job: feature_context_validate
      artifacts: true
  parallel:
    matrix:
      - SIMOS_MATRIX_CONFIG_REF: "SIMBOT_R6_A"
        SIMOS_MATRIX_CONFIG_LABEL: "360"
      - SIMOS_MATRIX_CONFIG_REF: "SIMBOT_R6_B"
        SIMOS_MATRIX_CONFIG_LABEL: "360s"
  script:
    # Every matrix instance independently freezes the signed SimOS/component
    # snapshot. Passing a whole source tree through artifacts exceeds the
    # coordinator limit and would serialize these otherwise parallel builds.
    - bash .gitlab/scripts/feature-package-prepare.sh feature-context.json feature-source
    - bash .gitlab/scripts/feature-package-build.sh resident feature-source feature-output
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - feature-context.json
      - feature-output/

feature_build_deb:
  extends: .feature_package_rules
  stage: feature_build
  # This tag MUST be configured as a non-privileged container executor. The
  # guard in the script fails closed when it is still the old shell executor.
  tags: ["simos-feature-build"]
  # This protected variable names the maintained build image. GitLab expands
  # simple CI variables here; Bash-style ${VAR:-default} is not valid YAML CI
  # variable interpolation on all supported GitLab versions.
  image: "$GITOPS_FEATURE_BUILD_IMAGE"
  variables:
    GIT_STRATEGY: fetch
  needs:
    - job: feature_context_validate
      artifacts: true
  parallel:
    matrix:
      - SIMOS_MATRIX_CONFIG_REF: "SIMBOT_R6_A"
        SIMOS_MATRIX_CONFIG_LABEL: "360"
      - SIMOS_MATRIX_CONFIG_REF: "SIMBOT_R6_B"
        SIMOS_MATRIX_CONFIG_LABEL: "360s"
  script:
    - bash .gitlab/scripts/feature-package-prepare.sh feature-context.json feature-source
    - bash .gitlab/scripts/feature-package-build.sh deb feature-source feature-output
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - feature-context.json
      - feature-output/

feature_publish_registry:
  extends: .feature_package_rules
  stage: feature_publish
  # Reuse the currently assigned protected publishing Runner. It is kept
  # separate from the non-privileged Feature build Runner.
  tags: ["gitops-feature-publisher"]
  image: "$GITOPS_FEATURE_BUILD_IMAGE"
  environment:
    name: feature-package-registry
  variables:
    GIT_STRATEGY: fetch
  needs:
    - job: feature_build_resident
      artifacts: true
    - job: feature_build_deb
      artifacts: true
  script:
    - bash .gitlab/scripts/feature-package-publish-registry.sh feature-context.json feature-output feature-publish
  artifacts:
    expire_in: 7 days
    paths:
      - feature-context.json
      - feature-output/
      - feature-publish/

feature_publish_nextcloud:
  extends: .feature_package_rules
  stage: feature_publish
  tags: ["gitops-feature-publisher"]
  image: "$GITOPS_FEATURE_BUILD_IMAGE"
  environment:
    name: feature-package-nextcloud
  variables:
    GIT_STRATEGY: fetch
  needs:
    - job: feature_publish_registry
      artifacts: true
  script:
    - bash .gitlab/scripts/feature-package-publish-nextcloud.sh feature-context.json feature-publish feature-package-result.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - feature-package-result.json
