# Trusted Feature packaging. This file belongs only on protected
# ci/feature-package and never includes a .gitlab-ci.yml from OS/simos.

.feature_package_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_NAME == "ci/feature-package" && $GITOPS_FEATURE_PACKAGE == "1"'
      when: on_success
    - when: never

feature_context_validate:
  extends: .feature_package_rules
  stage: package
  # All trusted scripts are checked out from the protected Workbench ref.
  # Do not run this untagged: an old OS/simos Shell Runner may otherwise pick
  # it up and execute without the CI repository checkout.
  tags: ["simos-feature-build"]
  image: docker.m.daocloud.io/python:3.12-alpine
  variables:
    GIT_STRATEGY: fetch
    SIMOS_DEB_BUILD_MODE: "all"
    SIMOS_DEB_BUILD_JOBS: "16"
  script:
    - python3 .gitlab/scripts/feature-package-validate.py
  artifacts:
    expire_in: 1 day
    paths:
      - feature-context.json

feature_build_resident:
  extends: .feature_package_rules
  stage: package
  # This tag MUST be configured as a non-privileged container executor. The
  # guard in the script fails closed when it is still the old shell executor.
  tags: ["simos-feature-build"]
  # This protected variable names the maintained build image. GitLab expands
  # simple CI variables here; Bash-style ${VAR:-default} is not valid YAML CI
  # variable interpolation on all supported GitLab versions.
  image: "$GITOPS_FEATURE_BUILD_IMAGE"
  variables:
    GIT_STRATEGY: fetch
    SIMOS_DEB_BUILD_MODE: "all"
    SIMOS_DEB_BUILD_JOBS: "16"
  needs:
    - job: feature_context_validate
      artifacts: true
  script:
    # Each build independently freezes the signed SimOS/component snapshot.
    - bash .gitlab/scripts/feature-package-prepare.sh feature-context.json feature-source
    - bash .gitlab/scripts/feature-package-build.sh resident feature-source feature-output
    # Upload the large resident payload while it is still local to the build
    # runner; only the verified Registry plan is passed to later jobs.
    - bash .gitlab/scripts/feature-package-publish-registry.sh resident feature-context.json feature-output feature-publish
  after_script:
    # Never archive the large resident payload through the GitLab coordinator.
    - rm -rf feature-output/resident/resident-packages feature-output/resident/deb-packages
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - feature-context.json
      - feature-output/resident/package-registry-result.json
      - feature-output/resident/build-info.json
      - feature-output/resident/checksums.txt
      - feature-output/resident/checksum.md5
      - feature-output/resident/resident-package-info/
      - feature-publish/

feature_build_deb:
  extends: .feature_package_rules
  stage: package
  # This tag MUST be configured as a non-privileged container executor. The
  # guard in the script fails closed when it is still the old shell executor.
  tags: ["simos-feature-build"]
  # This protected variable names the maintained build image. GitLab expands
  # simple CI variables here; Bash-style ${VAR:-default} is not valid YAML CI
  # variable interpolation on all supported GitLab versions.
  image: "$GITOPS_FEATURE_BUILD_IMAGE"
  variables:
    GIT_STRATEGY: fetch
    SIMOS_DEB_BUILD_MODE: "all"
    SIMOS_DEB_BUILD_JOBS: "16"
  needs:
    - job: feature_context_validate
      artifacts: true
  script:
    - bash .gitlab/scripts/feature-package-prepare.sh feature-context.json feature-source
    - bash .gitlab/scripts/feature-package-build.sh deb feature-source feature-output
    - bash .gitlab/scripts/feature-package-publish-registry.sh deb feature-context.json feature-output feature-publish
  after_script:
    # Never archive the large deb payload through the GitLab coordinator.
    - rm -rf feature-output/deb/deb-packages feature-output/deb/deb_packages
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - feature-context.json
      - feature-output/deb/deb-package-registry-result.json
      - feature-output/deb/build-info.json
      - feature-output/deb/checksums.txt
      - feature-output/deb/checksum.md5
      - feature-output/deb/deb-package-info/
      - feature-publish/

feature_publish_nextcloud_resident:
  extends: .feature_package_rules
  stage: publish
  tags: ["gitops-feature-publisher"]
  image: "$GITOPS_FEATURE_BUILD_IMAGE"
  environment:
    name: feature-package-nextcloud-resident
  variables:
    GIT_STRATEGY: fetch
  needs:
    - job: feature_build_resident
      artifacts: true
  script:
    - bash .gitlab/scripts/feature-package-publish-nextcloud.sh resident feature-context.json feature-publish feature-package-result.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - feature-package-result.json

feature_publish_nextcloud_deb:
  extends: .feature_package_rules
  stage: publish
  tags: ["gitops-feature-publisher"]
  image: "$GITOPS_FEATURE_BUILD_IMAGE"
  environment:
    name: feature-package-nextcloud-deb
  variables:
    GIT_STRATEGY: fetch
  needs:
    - job: feature_build_deb
      artifacts: true
  script:
    - bash .gitlab/scripts/feature-package-publish-nextcloud.sh deb feature-context.json feature-publish feature-package-result.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - feature-package-result.json
